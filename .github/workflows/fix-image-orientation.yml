name: Fix sideways site images

on:
  push:
    branches: [ main ]
    paths:
      - "assets/images/**"
      - ".github/workflows/fix-image-orientation.yml"

permissions:
  contents: write

jobs:
  rotate:
    if: "!contains(github.event.head_commit.message, '[skip image rotation]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rotate affected images upright
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick
          for f in \
            assets/images/lethabong-community-library.jpg \
            assets/images/makaunyane-clinic.jpg \
            assets/images/project-roofing.jpg
          do
            convert "$f" -rotate 90 -strip "$f"
          done
      - name: Commit corrected images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Fix sideways project images [skip image rotation]"
          git push
